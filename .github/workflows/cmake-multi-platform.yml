name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        build_type: [Release]
        compiler: [gcc, clang]
        include:
          - os: windows-latest
            compiler: gcc
            c_compiler: gcc
            cpp_compiler: g++
          - os: windows-latest
            compiler: clang
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-latest
            compiler: gcc
            # std::ranges::to requires libstdc++ 14 or newer.
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - os: ubuntu-latest
            compiler: clang
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --timeout 60 --no-tests=error
